name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node build.mjs

      - name: Tag matches VERSION
        run: |
          version=$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" src/exporter.js)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in src/exporter.js"
            exit 1
          fi

      - name: Lint Firefox extension
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --no-config-discovery

      - name: Package
        run: |
          mkdir -p out
          (cd extension && zip -qr "../out/eclass-exporter-chrome-$VERSION.zip" .)
          (cd dist/firefox && zip -qr "../../out/eclass-exporter-firefox-$VERSION.zip" .)
          cp dist/eclass-exporter.user.js out/
          ls -l out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Install

          **Chrome / Edge:** download \`eclass-exporter-chrome-$VERSION.zip\`, unzip it, open \`chrome://extensions\`, turn on *Developer mode* and click *Load unpacked*.

          **Firefox:** install Tampermonkey or Violentmonkey and open \`eclass-exporter.user.js\` below (recommended), or load \`eclass-exporter-firefox-$VERSION.zip\` from \`about:debugging\` as a temporary add-on (experimental).

          See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for details · [简体中文](https://github.com/$GITHUB_REPOSITORY/blob/main/README.zh-CN.md)
          EOF
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "eClass Exporter $VERSION" \
            --notes-file notes.md \
            --generate-notes
